<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="GuideTrain">
  <!--
    Three loaded bars, each shorter than the last.

    It is the programme the app teaches, drawn: 5/3/1 ramps up in weight and
    down in reps, and the last bar is the single you were working towards, so
    that is the one wearing the accent. Reads as a gym at a glance and as
    something specific on a second look, which is what a mark has to do.

    Colours are written out rather than inherited: a favicon is rendered
    outside the page, where CSS custom properties do not exist. The ink follows
    the browser theme, the accent does not need to.
  -->
  <style>
    .ink { fill: #1a1f28; }
    @media (prefers-color-scheme: dark) { .ink { fill: #e6e9ef; } }
  </style>
  <g class="ink">
    <rect x="5" y="5.5" width="22" height="3.4" rx="1.7"/>
    <rect x="3.4" y="3.6" width="2.6" height="7.2" rx="1.1"/>
    <rect x="26" y="3.6" width="2.6" height="7.2" rx="1.1"/>

    <rect x="8.5" y="14.3" width="15" height="3.4" rx="1.7"/>
    <rect x="6.9" y="12.4" width="2.6" height="7.2" rx="1.1"/>
    <rect x="22.5" y="12.4" width="2.6" height="7.2" rx="1.1"/>
  </g>
  <g fill="#c2410c">
    <rect x="12" y="23.1" width="8" height="3.4" rx="1.7"/>
    <rect x="10.4" y="21.2" width="2.6" height="7.2" rx="1.1"/>
    <rect x="19" y="21.2" width="2.6" height="7.2" rx="1.1"/>
  </g>
</svg>
