<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="GuideTrain">
  <!--
    An original bolt, not Vite's.

    The template's purple bolt is VoidZero's brand asset: the MIT licence
    covers Vite's code, not its logo, and its guidelines rule out both
    recolouring it and using it to stand for another product. The idea of a
    lightning bolt belongs to nobody, so this is one drawn from scratch on the
    app's own grid.

    The colour is written out rather than inherited, because a favicon renders
    outside the page where CSS custom properties do not exist. Both values are
    the app's own accent, one per theme.
  -->
  <style>
    .bolt { fill: #c2410c; }
    @media (prefers-color-scheme: dark) { .bolt { fill: #f97316; } }
  </style>
  <path class="bolt" d="M19.2 2.2 6.4 17.4a.9.9 0 0 0 .69 1.48h5.03l-1.3 10.02a.9.9 0 0 0 1.6.66l12.8-15.2a.9.9 0 0 0-.69-1.48h-5.03l1.3-10.02a.9.9 0 0 0-1.6-.66Z"/>
</svg>
