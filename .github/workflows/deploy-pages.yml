name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app
        working-directory: apps/web
        # Served at the root of guidetrain.me rather than under a repo
        # subpath, so the default base is correct. apps/web/public/CNAME is
        # what keeps the domain attached: with an Actions deploy the setting in
        # Pages is re-applied from the artifact, and an artifact without that
        # file silently drops the custom domain on the next push.
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
