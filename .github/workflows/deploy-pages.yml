name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app
        working-directory: apps/web
        # Served at the root of guidetrain.me rather than under a repo
        # subpath, so the default base is correct. apps/web/public/CNAME is
        # what keeps the domain attached: with an Actions deploy the setting in
        # Pages is re-applied from the artifact, and an artifact without that
        # file silently drops the custom domain on the next push.
        #
        # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are baked in here,
        # Vite env vars being resolved at build time rather than read at
        # runtime. Both are meant to end up in the public bundle -- the
        # publishable key names the project, not a person, and row-level
        # security is what actually protects the data (supabase/README.md) --
        # so these are ordinary repository secrets, not anything sensitive
        # enough to need a vault. Left unset, as on a fork with no Supabase
        # project, hasBackend is false and the app is exactly what it was
        # before accounts existed: no button, nothing missing.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
